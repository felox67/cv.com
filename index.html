<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GreenAuth - Login</title>

    <link rel="stylesheet" href="login-style.css">

    <!-- Google Material Icons -->
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>

<body>

    <main class="auth-container">

        <section class="auth-card">

            <!-- Logo -->
            <div class="logo">
            <img src="authlogo.png" alt="GreenAuth Logo" class="logo-icon">    
            
                <span>GreenAuth Extra Cv</span>
            </div>

            <!-- Login -->
            <div class="form-section active" id="loginSection">

                <h1>Welcome back</h1>
                <p class="subtitle">Log in to your account</p>

                <form id="loginForm">

                    <div class="input-group">
                        <label for="loginEmail">Email address</label>
                        <input
                            type="email"
                            id="loginEmail"
                            placeholder="you@example.com"
                            required
                        >
                    </div>

                    <div class="input-group">
                        <div class="label-row">
                            <label for="loginPassword">Password</label>
                            <a href="#" class="forgot">Forgot password?</a>
                        </div>

                        <div class="password-wrapper">
                            <input
                                type="password"
                                id="loginPassword"
                                placeholder="Enter your password"
                                required
                            >

                            <button
                                type="button"
                                class="password-toggle"
                                onclick="togglePassword('loginPassword', this)"
                            >
                                
                            </button>
                        </div>
                    </div>

                    <div class="remember">
                        <label>
                            <input type="checkbox">
                            <span>Remember me</span>
                        </label>
                    </div>

                    <button type="submit" class="primary-btn">
                        Log in
                    </button>

                    <p id="loginStatus" class="login-status" role="status" aria-live="polite"></p>

                </form>

                <div class="divider">
                    <span>OR</span>
                </div>

                <button class="google-btn" onclick="googleLogin()">
                    <span class="google-icon">G</span>
                    Continue with Google
                </button>

                <p class="switch-text">
                    Don't have an account?
                    <button onclick="showSignup()">Create account</button>
                </p>

            </div>


            <!-- Sign Up -->
            <div class="form-section" id="signupSection">

                <h1>Create account</h1>
                <p class="subtitle">Join GreenAuth today</p>

                <form id="signupForm">

                    <div class="input-group">
                        <label for="signupName">Full name</label>
                        <input
                            type="text"
                            id="signupName"
                            placeholder="John Doe"
                            required
                        >
                    </div>

                    <div class="input-group">
                        <label for="signupEmail">Email address</label>
                        <input
                            type="email"
                            id="signupEmail"
                            placeholder="you@example.com"
                            required
                        >
                    </div>

                    <div class="input-group">
                        <label for="signupPassword">Password</label>

                        <div class="password-wrapper">
                            <input
                                type="password"
                                id="signupPassword"
                                placeholder="Create a password"
                                required
                            >

                            <button
                                type="button"
                                class="password-toggle"
                                onclick="togglePassword('signupPassword', this)"
                            >
                                <span class="material-icons">visibility</span>
                            </button>
                        </div>
                    </div>

                    <div class="input-group">
                        <label for="confirmPassword">Confirm password</label>

                        <div class="password-wrapper">
                            <input
                                type="password"
                                id="confirmPassword"
                                placeholder="Confirm your password"
                                required
                            >

                            <button
                                type="button"
                                class="password-toggle"
                                onclick="togglePassword('confirmPassword', this)"
                            >
                                <span class="material-icons">visibility</span>
                            </button>
                        </div>
                    </div>

                    <label class="terms">
                        <input type="checkbox" required>
                        <span>
                            I agree to the
                            <a href="#">Terms & Conditions</a>
                        </span>
                    </label>

                    <button type="submit" class="primary-btn">
                        Create account
                    </button>

                </form>

                <div class="divider">
                    <span>OR</span>
                </div>

                <button class="google-btn" onclick="googleLogin()">
                    <span class="google-icon">G</span>
                    Sign up with Google
                </button>

                <p class="switch-text">
                    Already have an account?
                    <button onclick="showLogin()">Log in</button>
                </p>

            </div>

        </section>

    </main>

    <script src="login.js"></script>

</body>
</html>
